name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências essenciais
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Instalar Buildozer e Cython
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.36 virtualenv

      - name: Compilar APK
        run: |
          export PATH=$PATH:~/.local/bin/
          yes | buildozer android debug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ControleSemp-APK
          path: bin/*.apk
